<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t">
  <title id="t">Héros de Midgard entouré d'une aura lumineuse devant la cité</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0C10"/><stop offset=".55" stop-color="#1A1420"/><stop offset="1" stop-color="#2A1610"/>
    </linearGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE8D6" stop-opacity=".9"/>
      <stop offset=".25" stop-color="#FF6B00" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#FF3D00" stop-opacity=".15"/>
      <stop offset="1" stop-color="#FF3D00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".4" cy=".4" r=".6">
      <stop offset="0" stop-color="#FFE8D6"/><stop offset="1" stop-color="#F4A261"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C26"/><stop offset="1" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".4" stop-color="#FFE8D6"/><stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B00"/><stop offset="1" stop-color="#F4A261"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#FFE8D6">
    <circle cx="90" cy="80" r="1.6" opacity=".7"/><circle cx="210" cy="160" r="1.2" opacity=".5"/>
    <circle cx="330" cy="60" r="2" opacity=".8"/><circle cx="480" cy="130" r="1.2" opacity=".5"/>
    <circle cx="760" cy="70" r="1.6" opacity=".7"/><circle cx="880" cy="170" r="1.2" opacity=".5"/>
    <circle cx="1010" cy="90" r="2" opacity=".8"/><circle cx="1130" cy="200" r="1.4" opacity=".6"/>
    <circle cx="640" cy="40" r="1.2" opacity=".6"/><circle cx="1080" cy="40" r="1.2" opacity=".5"/>
  </g>
  <circle cx="930" cy="190" r="70" fill="url(#moon)" opacity=".9"/>
  <circle cx="955" cy="175" r="70" fill="#1A1420" opacity=".55"/>
  <!-- far mountains -->
  <path d="M0 560 L120 430 L220 500 L340 380 L470 490 L560 420 L680 520 L800 400 L930 500 L1050 420 L1200 520 L1200 900 L0 900 Z" fill="#191720"/>
  <!-- city of Midgard -->
  <g fill="#120F16">
    <path d="M0 640 L0 590 L60 590 L60 560 L80 540 L100 560 L100 590 L160 590 L160 620 Z"/>
    <path d="M160 640 L160 520 L180 490 L200 520 L200 560 L240 560 L240 500 L262 460 L284 500 L284 640 Z"/>
    <path d="M880 640 L880 540 L905 500 L930 540 L930 570 L980 570 L980 480 L1004 430 L1028 480 L1028 640 Z"/>
    <path d="M1028 640 L1028 580 L1090 580 L1090 545 L1110 520 L1130 545 L1130 590 L1200 590 L1200 640 Z"/>
  </g>
  <g fill="#F4A261" opacity=".65">
    <rect x="186" y="530" width="6" height="10"/><rect x="258" y="510" width="6" height="12"/>
    <rect x="1000" y="490" width="6" height="12"/><rect x="908" y="552" width="6" height="10"/>
    <rect x="76" y="570" width="6" height="8"/><rect x="1106" y="556" width="6" height="8"/>
  </g>
  <!-- ground -->
  <path d="M0 700 C250 650 450 640 600 650 C760 640 960 650 1200 700 L1200 900 L0 900 Z" fill="#0B0C10"/>
  <!-- aura -->
  <circle cx="600" cy="470" r="360" fill="url(#aura)"/>
  <g fill="none" stroke="#FF6B00" stroke-opacity=".45" stroke-width="2">
    <ellipse cx="600" cy="690" rx="230" ry="36"/>
    <ellipse cx="600" cy="690" rx="160" ry="22" stroke="#FFE8D6" stroke-opacity=".5"/>
  </g>
  <!-- hero silhouette -->
  <g>
    <!-- cape -->
    <path d="M560 330 C500 420 470 560 440 690 L760 690 C730 560 700 420 640 330 Z" fill="#100D12"/>
    <path d="M560 330 C500 420 470 560 440 690" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".8"/>
    <path d="M640 330 C700 420 730 560 760 690" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".8"/>
    <!-- legs -->
    <path d="M570 520 L560 690 L592 690 L600 560 L608 690 L640 690 L630 520 Z" fill="url(#hero)"/>
    <!-- torso -->
    <path d="M555 330 L645 330 L660 420 L640 530 L560 530 L540 420 Z" fill="url(#hero)"/>
    <path d="M580 360 L620 360 L612 470 L588 470 Z" fill="#FF6B00" opacity=".25"/>
    <!-- shoulders -->
    <path d="M530 330 C540 305 570 300 590 312 L585 345 L530 350 Z" fill="#1E1F2A" stroke="#F4A261" stroke-width="2"/>
    <path d="M670 330 C660 305 630 300 610 312 L615 345 L670 350 Z" fill="#1E1F2A" stroke="#F4A261" stroke-width="2"/>
    <!-- head + helm wings -->
    <circle cx="600" cy="285" r="34" fill="url(#hero)" stroke="#F4A261" stroke-width="2"/>
    <path d="M568 278 C540 250 520 246 498 252 C520 262 536 274 548 290 Z" fill="#F4A261"/>
    <path d="M632 278 C660 250 680 246 702 252 C680 262 664 274 652 290 Z" fill="#F4A261"/>
    <path d="M586 290 h28" stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>
    <!-- arm raising sword -->
    <path d="M655 340 L720 270 L738 286 L672 362 Z" fill="url(#hero)"/>
    <path d="M545 345 L505 440 L525 450 L566 360 Z" fill="url(#hero)"/>
    <!-- sword -->
    <g transform="rotate(35 735 270)">
      <path d="M735 40 L750 80 L746 250 L724 250 L720 80 Z" fill="url(#blade)"/>
      <rect x="700" y="250" width="70" height="12" rx="6" fill="#F4A261"/>
      <rect x="728" y="262" width="14" height="40" rx="4" fill="#C46A1E"/>
    </g>
  </g>
  <!-- particles -->
  <g fill="#FF6B00">
    <circle cx="430" cy="380" r="4" opacity=".8"/><circle cx="780" cy="420" r="3" opacity=".7"/>
    <circle cx="470" cy="250" r="2.5" opacity=".6"/><circle cx="820" cy="300" r="4" opacity=".6"/>
    <circle cx="380" cy="560" r="3" opacity=".5"/><circle cx="840" cy="580" r="3.5" opacity=".6"/>
  </g>
  <g fill="#FFE8D6">
    <circle cx="520" cy="200" r="2" opacity=".8"/><circle cx="700" cy="520" r="2" opacity=".7"/>
    <circle cx="450" cy="470" r="2" opacity=".6"/><circle cx="760" cy="200" r="2.4" opacity=".8"/>
  </g>
</svg>
